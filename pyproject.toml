[project]
name = "pwned-passwords"
version = "1.1.1"
description = "Pwned Passwords API wrapper"
readme = "README.md"
authors = [{ name = "Caleb", email = "le717@users.noreply.github.com" }]
license = "MIT"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Version Control :: Git",
  "Typing :: Typed",
]

requires-python = ">=3.14"
dependencies = ["httpx>=0.28.1"]

[project.urls]
homepage = "https://github.com/le717/pwned-passwords"
source = "https://github.com/le717/pwned-passwords.git"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "ty>=0.0.104",
]
ntlm = ["pyspnego>=0.12.4"]
# django = ["django>=6.1.3"]

[tool.ruff]
indent-width = 4
line-length = 100


[tool.ruff.format]
preview = true
line-ending = "native"
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
preview = true

[tool.ruff.lint.per-file-ignores]
# Turn off some rules for tests
"tests/*.py" = [
  "D", # pydocstyle
]

# Linting rules
select = [
  "C90",    # mccabe
  "D",      # pydocstyle
  "E",      # pycodestyle
  "W",      # pycodestyle
  "ERA",    # eradicate
  "F",      # pyflakes
  "FIX",    # flake8-fixme
  "I",      # isort
  "RET",    # flake8-return
  "RUF200", # ruff invalid-pyproject-toml
  "SIM",    # flake8-simplify
  "UP",     # pyupgrade
]

ignore = [
  "D100", # undocumented-public-module
  "D104", # undocumented-public-package
  "D203", # one-blank-line-before-class
  "D213", # multi-line-summary-second-line
]


[tool.ruff.lint.isort]
# Match isort profile=black for blank lines after imports
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10
